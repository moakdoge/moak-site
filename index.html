<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html>
<title>moakdoge.dev</title>
<meta name="viewport" content="width-device-width, initial-scale=1.0">
<body id="main-body">
    <div class="term-log" id="term-log">
        <div class="input" id="input-prompt">
            <span class="prompt" id="prompt-text">you@moakdoge.dev > </span>
            <input class="command-box" id="command-input" value="test" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        </div>
    </div>
    <script src="backend.js"></script>
    <script>
        registerCommand("help",  "Helps you.", "moakdoge", function (args){
            for (let command in commands) {
                let description = commands[command].description;

                if (description == undefined) {
                    continue;
                }
               
                if (commands[command].hidden) {
                    continue;
                }
                printToLog(commands[command].name + ": " + description);
            }
        })

        registerCommand("echo",  "Echoes your input.", "moakdoge", function (args){
            let output = args.slice(1).join(" ");
            printToLog(output);
        });

        registerCommand("history", "Shows the command history.", "moakdoge", function (args){
            for (let i = 0; i < commandHistory.length; i++) {
                printToLog(commandHistory[i]);
            }
        })

        registerCommand("whoami",  "Tells you a bit about me", "moakdoge", function (args){
            printToLog(loadMessage("whoami"));
        });

        registerCommand("languages", "My programming languages", "moakdoge", function (args) {
            let myLangs = {
                python: new Date("2023-8-10"),
                lua: new Date("2020-11-23"),
                "C++": new Date("2025-8-15"),
            }

            Object.entries(myLangs).forEach(function ([name, date]){
                const now = date;
                const month = now.toLocaleString('en-US', { month: 'short' });
                const year = now.getFullYear();
                printToLog("%n: since %m, %y".replace("%n", name).replace("%m", month).replace("%y", year))
            })
            
        })

        registerCommand("socials", "My social medias", "moakdoge", function (args) {
           
            let mySocials = {
                GitHub: {handle: "@moakdoge", link: "https://github.com/moakdoge",},
                YouTube: {handle: "@moakdoge", link: "https://www.youtube.com/@moakdoge"},
                Discord: {handle: "@moakdoge", link: "https://discord.com/users/866493074699321354"},
                Email: {handle: "root@moakdoge.dev", link: "mailto:root.moakdoge.dev"}
            
            };

            Object.entries(mySocials).forEach(function ([name, info]){
                const handle = info.handle;
                const link = info.link;

                let output = "%name: [%username](%link)"
                .replace("%name", name)
                .replace("%username", handle)
                .replace("%link", link);

                printToLog(output);

            });
        })

        registerCommand("clear", "Clears the terminal", "moakdoge", clearLog);


        registerCommand("eval", "Evaluates an input.", "moakdoge", function (args) {
            let fixed = args.slice(1).join(" ");
            let val = eval(fixed);
            printToLog(val?.toString() ?? "No output");
        })
        

        registerStupidCommand("source", "$message source", false, "Gets info about this site's source.", "moakdoge");
        registerStupidCommand("about", "$message about", false, "About me.", "moakdoge");

        /* Secret commands. You found them.*/
        registerStupidCommand("sudo", "... You're root.");
        registerStupidCommand("ls", "No files here, man. It's just a stupid website. I don't wannt implement a file system.");
        registerStupidCommand("ssh", "I wish, man. I'm not that talented.");
        registerStupidCommand("moakdoge", "yep... that's me.");
        registerStupidCommand("scatty", "go check out my friend scatty: [scatty](https://scatty.ing)");
        registerStupidCommand("reboot", "You really think a browser can reboot your computer?");
        registerStupidCommand("exit", "I would've made it close the tab. But for some reason browsers don't allow that, so this is what you get.");
        registerStupidCommand("mkdir", "Nope. Not making a filesystem.");
        registerStupidCommand("cat", "I don't have any files, how would cat even work?");
        registerStupidCommand("apt", "This is not Ubuntu!");
        registerStupidCommand("pacman", "This is not Arch! (i use arch btw)");
        registerStupidCommand("dnf", "This is not Fedora!");
        registerStupidCommand("zypper", "This is not openSUSE!");
        registerStupidCommand("emerge", "Huh... A gentoo user. I didn't think you guys existed. Regardless, this is not gentoo.");
        registerStupidCommand("xbps-install", "XBPS? What even is that? Who are you?");
        registerStupidCommand("apk", "This is not Alphine! (iSH? Random embedded? Who are you?)");
        registerStupidCommand("wget", "Nope. This is not a real terminal. I mean, you have |eval|; You can use that to use fetch, but otherwise this is a nogo.");
        registerStupidCommand("curl", "Read |wget|, but this won't ever work.");
        registerStupidCommand("cd", "No file system. Never will be.");
        registerStupidCommand("pwd", "You're in /. Once again, no file system.");
        registerStupidCommand("cp", "Really?");
        registerStupidCommand("mv", "There's nothing to even move!");
        registerStupidCommand("rmdir", "There's no directories to remove!");
        registerStupidCommand("touch", "Nice try.");
        registerStupidCommand("kill", "Can't kill anything here, bucko.");
        registerStupidCommand("chmod", "No files to own. Do not know why you're trying.");
        registerStupidCommand("ping", "Go do ping on your own terminal.");
        registerStupidCommand("arknight", "rose12344 made me add this. You know who you are.");
        aliasCommand("arknights", "arknight");
        aliasCommand("neofetch", "fastfetch");
        aliasCommand("yay", "pacman");
        aliasCommand("apt-get", "apt");

        registerStupidCommand("ai-use", `$message ai-use`, false, "How AI was used on this site.", "moakdoge");

        registerCommand("hostname", `Sets or reads your hostname. Defaults to ${hostname}.`, "moakdoge", function (args) {
            let newHostName = args[1];
            if (newHostName == undefined) {
                printToLog(`Your current hostname is ${hostname}.`);
                return;
            }
            hostname = newHostName;
            printToLog(`Fine, I'll change the hostname. Grumble. Your new hostname is ${hostname}.`)
        });
        registerCommand("username", `Sets or reads your username. Defaults to ${username}.`, "moakdoge", function (args) {
            let newUser = args[1];
            if (newUser == undefined) {
                printToLog(`Your current username is ${username}.`);
                return;
            }
            username = newUser;
            printToLog(`Fine, I'll change the username. Why you care? Don't ask me. Your new name is ${username}.`)
        });

        registerCommand("fastfetch", "Gets some information about this 'OS'.", "moakdoge",function (args) {
            let fixed = loadMessage("fastfetch");

            printToLog("<pre>"+fixed+"</pre>");
        })

        /* debug commands i may or may not remove */
        registerStupidCommand("formatting-test", "$message formatting-test");

        /* You guys are laughing at me. For sure. I don't care if it works it works*/
        runCommand(processCommandInput("whoami"));
        runCommand(processCommandInput("echo '---------------------'"));
        runCommand(processCommandInput("help"));
        runCommand(processCommandInput("\n"));
        commandHistory = [];
    </script>
</body>
</html>
